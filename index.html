<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definite Integration Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --primary-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 350px 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1a202c;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #4a5568;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #ebf8ff;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
        }

        .result-title {
            font-size: 0.875rem;
            color: #2b6cb0;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c5282;
            word-break: break-all;
        }

        .error {
            color: #e53e3e;
            background-color: #fff5f5;
            border-left: 4px solid #e53e3e;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .graph-container {
            position: relative;
            min-height: 400px;
            height: 100%;
            background: var(--card-bg);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        .math-hint {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h1>Integration Calculator</h1>
        
        <div class="input-group">
            <label for="function">Function f(x)</label>
            <input type="text" id="function" value="x^2 - 2x">
            <div class="math-hint">e.g., x^3, sin(x), exp(x), 1/x</div>
        </div>

        <div class="input-group">
            <label for="lowerBound">Lower Limit (a)</label>
            <input type="number" id="lowerBound" value="0" step="any">
        </div>

        <div class="input-group">
            <label for="upperBound">Upper Limit (b)</label>
            <input type="number" id="upperBound" value="3" step="any">
        </div>

        <div id="errorMessage" class="error"></div>

        <div class="result-box">
            <div class="result-title">Definite Integral Value</div>
            <div id="result" class="result-value">0</div>
        </div>
    </div>

    <div class="panel graph-container">
        <canvas id="graphCanvas"></canvas>
    </div>
</div>

<script>
    let chartInstance = null;

    // Elements
    const functionInput = document.getElementById('function');
    const lowerInput = document.getElementById('lowerBound');
    const upperInput = document.getElementById('upperBound');
    const resultDisplay = document.getElementById('result');
    const errorDisplay = document.getElementById('errorMessage');

    // Event Listeners for Live Updates
    functionInput.addEventListener('input', calculateAndPlot);
    lowerInput.addEventListener('input', calculateAndPlot);
    upperInput.addEventListener('input', calculateAndPlot);

    // Initial setup
    window.onload = () => {
        calculateAndPlot();
    };

    function calculateAndPlot() {
        errorDisplay.style.display = 'none';
        const exprString = functionInput.value.trim();
        const a = parseFloat(lowerInput.value);
        const b = parseFloat(upperInput.value);

        if (!exprString) return;
        if (isNaN(a) || isNaN(b)) {
            showError("Please enter valid numeric limits.");
            return;
        }

        try {
            // Compile expression via math.js
            const compiledExpr = math.compile(exprString);
            
            // 1. Calculate Integral using Simpson's Rule (1000 intervals)
            const n = 1000; 
            const integralVal = simpsonsRule(compiledExpr, a, b, n);
            
            // Format result output nicely
            if (isNaN(integralVal) || !isFinite(integralVal)) {
                resultDisplay.innerText = "Undefined";
            } else {
                resultDisplay.innerText = Number(integralVal.toFixed(5)).toString();
            }

            // 2. Generate data points for Plotting
            // Dynamic padding so the graph view extends a bit past the integration interval [a, b]
            const span = Math.abs(b - a) || 4;
            const startX = Math.min(a, b) - span * 0.5;
            const endX = Math.max(a, b) + span * 0.5;
            
            const pointsCount = 200;
            const step = (endX - startX) / pointsCount;
            
            const mainLineData = [];
            const shadedData = [];

            for (let i = 0; i <= pointsCount; i++) {
                const x = startX + i * step;
                let y;
                try {
                    y = compiledExpr.evaluate({ x: x });
                } catch(e) {
                    y = NaN;
                }

                if (typeof y === 'number' && !isNaN(y) && isFinite(y)) {
                    mainLineData.push({ x: x, y: y });
                    
                    // Populate shaded area if x falls inside integration limits [a, b]
                    const minLimit = Math.min(a, b);
                    const maxLimit = Math.max(a, b);
                    // Tiny buffer to prevent boundary bleeding errors in graphing
                    if (x >= minLimit - 0.00001 && x <= maxLimit + 0.00001) {
                        shadedData.push({ x: x, y: y });
                    }
                }
            }

            updateGraph(mainLineData, shadedData, a, b);

        } catch (error) {
            showError("Invalid function expression. Use standard math notation.");
            resultDisplay.innerText = "Error";
        }
    }

    // Numerical integration implementation (Simpson's 1/3 Rule)
    function simpsonsRule(expr, a, b, n) {
        if (a === b) return 0;
        // If limits are swapped, reverse calculation and negate later
        let invert = false;
        if (a > b) {
            let temp = a;
            a = b;
            b = temp;
            invert = true;
        }

        // Ensure n is even
        if (n % 2 !== 0) n++; 
        
        const h = (b - a) / n;
        let sum = 0;

        try {
            const f_a = expr.evaluate({ x: a });
            const f_b = expr.evaluate({ x: b });
            if (!isFinite(f_a) || !isFinite(f_b)) return NaN;
            
            sum += f_a + f_b;

            for (let i = 1; i < n; i++) {
                const x = a + i * h;
                const f_x = expr.evaluate({ x: x });
                if (!isFinite(f_x)) return NaN;
                
                if (i % 2 === 0) {
                    sum += 2 * f_x;
                } else {
                    sum += 4 * f_x;
                }
            }
        } catch(e) {
            return NaN;
        }

        let result = (h / 3) * sum;
        return invert ? -result : result;
    }

    function updateGraph(linePoints, shadedPoints, a, b) {
        const ctx = document.getElementById('graphCanvas').getContext('2d');
        
        // Destroy old instance to refresh canvas correctly
        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    {
                        label: 'f(x)',
                        data: linePoints,
                        showLine: true,
                        borderColor: '#3182ce',
                        borderWidth: 3,
                        pointRadius: 0,
                        fill: false,
                        order: 1
                    },
                    {
                        label: 'Integrated Area',
                        data: shadedPoints,
                        showLine: true,
                        borderColor: 'transparent',
                        pointRadius: 0,
                        backgroundColor: 'rgba(49, 130, 206, 0.25)',
                        fill: 'origin', // Fills down to y=0 line
                        order: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: true }
                },
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        grid: {
                            color: '#e2e8f0'
                        },
                        title: {
                            display: true,
                            text: 'x'
                        }
                    },
                    y: {
                        type: 'linear',
                        grid: {
                            color: '#e2e8f0'
                        },
                        title: {
                            display: true,
                            text: 'y'
                        }
                    }
                }
            }
        });
    }

    function showError(msg) {
        errorDisplay.innerText = msg;
        errorDisplay.style.display = 'block';
    }
</script>

</body>
</html>
